services:
  php:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    image: autofarmer-php
    container_name: autofarmer-php
    restart: unless-stopped
    environment:
      APP_ENV: local
      APP_DEBUG: 'true'
    env_file:
      - .env
    volumes:
      - ./:/var/www/html
    depends_on:
      mysql:
        condition: service_healthy

  nginx:
    image: nginx:1.27-alpine
    container_name: autofarmer-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - php

  mysql:
    image: mysql:8.4
    container_name: autofarmer-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: autofarmer
      MYSQL_USER: autofarmer
      MYSQL_PASSWORD: autofarmer
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 5

  reverb:
    image: autofarmer-php
    container_name: autofarmer-reverb
    restart: unless-stopped
    command: php artisan reverb:start --host=0.0.0.0 --port=6001
    env_file:
      - .env
    volumes:
      - ./:/var/www/html
    depends_on:
      - mysql
    ports:
      - "6001:6001"

volumes:
  db_data:
